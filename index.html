    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Tek canonical host: www → apex. SWA host bazlı redirect desteklemediği için
      // burada yapıyoruz. Aksi halde oturum çerezi apex ve www için ayrı ayrı yazılıp
      // biri diğerini gölgeliyor (kullanıcı "başka hesaba geçemiyorum" yaşıyor).
      if (location.hostname === 'www.techcoach.com.tr') {
        location.replace(
          'https://techcoach.com.tr' + location.pathname + location.search + location.hash,
        )
      }
    </script>
